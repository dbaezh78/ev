<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendario Litúrgico - Evangelio del Día</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            line-height: 1.6;
            margin: 0;
            padding: 20px;
            background-color: #f5f5f5;
            color: #333;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        h1, h2 {
            color: #2c3e50;
            text-align: center;
        }
        .calendar {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }
        .day-header {
            font-weight: bold;
            text-align: center;
            padding: 10px;
            background: #3498db;
            color: white;
            border-radius: 4px;
        }
        .day {
            border: 1px solid #ddd;
            padding: 10px;
            min-height: 80px;
            border-radius: 4px;
            background: white;
        }
        .day:hover {
            background: #f0f0f0;
            cursor: pointer;
        }
        .today {
            background: #e3f2fd;
            border: 2px solid #3498db;
        }
        .liturgical-info {
            font-size: 0.8em;
            color: #7f8c8d;
        }
        .audio-player {
            width: 100%;
            margin-top: 20px;
            padding: 20px;
            background: #e8f4f8;
            border-radius: 8px;
            text-align: center;
        }
        .month-selector {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        button {
            padding: 8px 16px;
            background: #3498db;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background: #2980b9;
        }
        .empty-day {
            background: #f9f9f9;
            border: none;
        }
        .year-selector {
            text-align: center;
            margin-bottom: 10px;
        }
        .year-selector select {
            padding: 5px;
            border-radius: 4px;
            border: 1px solid #ddd;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Calendario Litúrgico</h1>
        <div class="year-selector">
            <select id="year-select">
                <!-- Las opciones se generarán con JavaScript -->
            </select>
        </div>
        <div class="month-selector">
            <button id="prev-month">Mes Anterior</button>
            <h2 id="current-month">Abril 2025</h2>
            <button id="next-month">Mes Siguiente</button>
        </div>
        
        <div class="calendar" id="calendar">
            <!-- Los días se generarán con JavaScript -->
        </div>
        
        <div class="audio-player" id="audio-player">
            <h3 id="audio-title">Evangelio del día</h3>
            <audio id="audio-element" controls style="width: 100%;">
                Tu navegador no soporta el elemento de audio.
            </audio>
            <p id="audio-path"></p>
        </div>
    </div>

    <script>
        // Datos litúrgicos para múltiples años
        const liturgicalData = {
            "2025": {
                "ta": { start: "2024-12-01", end: "2024-12-24", weeks: 4 },
                "tn": { start: "2024-12-25", end: "2025-01-12", weeks: 3 },
                "to1": { start: "2025-01-13", end: "2025-03-04", weeks: 8 },
                "tc": { start: "2025-03-05", end: "2025-04-19", weeks: 7 },
                "tp": { start: "2025-04-20", end: "2025-06-07", weeks: 7 },
                "to2": { start: "2025-06-08", end: "2025-11-29", weeks: 25 },
                "ta-next": { start: "2025-11-30", end: "2025-12-24", weeks: 4 }
            },
            "2026": {
                "ta": { start: "2025-11-30", end: "2025-12-24", weeks: 4 },
                "tn": { start: "2025-12-25", end: "2026-01-11", weeks: 3 },
                "to1": { start: "2026-01-12", end: "2026-02-17", weeks: 6 },
                "tc": { start: "2026-02-18", end: "2026-04-04", weeks: 7 },
                "tp": { start: "2026-04-05", end: "2026-05-23", weeks: 7 },
                "to2": { start: "2026-05-24", end: "2026-11-28", weeks: 27 },
                "ta-next": { start: "2026-11-29", end: "2026-12-24", weeks: 4 }
            }
        };

        // Mapeo de códigos a nombres completos
        const timeNames = {
            "ta": "Adviento",
            "tn": "Navidad",
            "to": "Ordinario",
            "tc": "Cuaresma",
            "tp": "Pascua"
        };

        // Obtener el tiempo litúrgico y semana para una fecha dada
        function getLiturgicalInfo(date) {
            const year = date.getFullYear();
            const dateStr = formatDate(date);
            
            // Verificar si tenemos datos para este año
            if (!liturgicalData[year]) {
                return { time: "to", week: 0, day: date.getDay() };
            }
            
            // Verificar cada tiempo litúrgico
            for (const [time, data] of Object.entries(liturgicalData[year])) {
                const start = new Date(data.start);
                const end = new Date(data.end);
                
                if (date >= start && date <= end) {
                    // Calcular la semana
                    const msPerDay = 24 * 60 * 60 * 1000;
                    const daysDiff = Math.floor((date - start) / msPerDay);
                    const week = Math.floor(daysDiff / 7) + 1;
                    
                    // Para el tiempo ordinario, determinar si es primera o segunda parte
                    const timeCode = time.startsWith("to") ? "to" : time;
                    
                    return {
                        time: timeCode,
                        week: week,
                        day: date.getDay() // 0=domingo, 1=lunes, etc.
                    };
                }
            }
            
            // Si no está en ningún tiempo (no debería pasar con datos correctos)
            return { time: "to", week: 0, day: date.getDay() };
        }

        // Obtener el nombre del día de la semana
        function getDayName(dayIndex) {
            const days = ["Domingo", "Lunes", "Martes", "Miércoles", "Jueves", "Viernes", "Sábado"];
            return days[dayIndex];
        }

        // Formatear fecha como YYYY-MM-DD
        function formatDate(date) {
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }

        // Generar la ruta del audio basada en la información litúrgica
        function getAudioPath(liturgicalInfo) {
            const timeCode = liturgicalInfo.time;
            const week = liturgicalInfo.week;
            const day = liturgicalInfo.day;
            
            const dayName = getDayName(day).toLowerCase();
            
            return `${timeCode}/s${week}/${dayName}/evangelio.mp3`;
        }

        // Generar el calendario para un mes y año específicos
        function generateCalendar(year, month) {
            const calendarEl = document.getElementById('calendar');
            calendarEl.innerHTML = '';
            
            // Añadir encabezados de días
            const days = ['Dom', 'Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb'];
            days.forEach(day => {
                const dayHeader = document.createElement('div');
                dayHeader.className = 'day-header';
                dayHeader.textContent = day;
                calendarEl.appendChild(dayHeader);
            });
            
            // Obtener primer día del mes y día de la semana en que cae
            const firstDay = new Date(year, month, 1);
            const firstDayIndex = firstDay.getDay();
            
            // Obtener último día del mes
            const lastDay = new Date(year, month + 1, 0);
            const lastDate = lastDay.getDate();
            
            // Obtener el día actual para resaltarlo
            const today = new Date();
            const isCurrentMonth = today.getFullYear() === year && today.getMonth() === month;
            
            // Añadir días vacíos al inicio si es necesario
            for (let i = 0; i < firstDayIndex; i++) {
                const emptyDay = document.createElement('div');
                emptyDay.className = 'empty-day';
                calendarEl.appendChild(emptyDay);
            }
            
            // Añadir los días del mes
            for (let date = 1; date <= lastDate; date++) {
                const dayEl = document.createElement('div');
                dayEl.className = 'day';
                dayEl.textContent = date;
                
                const currentDate = new Date(year, month, date);
                const liturgicalInfo = getLiturgicalInfo(currentDate);
                
                // Añadir información litúrgica
                const infoEl = document.createElement('div');
                infoEl.className = 'liturgical-info';
                infoEl.textContent = `${timeNames[liturgicalInfo.time]} - Semana ${liturgicalInfo.week}`;
                dayEl.appendChild(infoEl);
                
                // Resaltar el día actual
                if (isCurrentMonth && date === today.getDate()) {
                    dayEl.classList.add('today');
                }
                
                // Guardar la fecha en el elemento para usarla al hacer clic
                dayEl.dataset.date = formatDate(currentDate);
                dayEl.dataset.audioPath = getAudioPath(liturgicalInfo);
                
                dayEl.addEventListener('click', function() {
                    playAudio(this.dataset.audioPath, currentDate);
                });
                
                calendarEl.appendChild(dayEl);
            }
            
            // Actualizar el título del mes
            const monthNames = ["Enero", "Febrero", "Marzo", "Abril", "Mayo", "Junio",
                              "Julio", "Agosto", "Septiembre", "Octubre", "Noviembre", "Diciembre"];
            document.getElementById('current-month').textContent = `${monthNames[month]} ${year}`;
            
            // Si es el mes actual, reproducir automáticamente el audio de hoy
            if (isCurrentMonth) {
                const todayEl = document.querySelector('.today');
                if (todayEl) {
                    const todayDate = new Date(year, month, today.getDate());
                    playAudio(todayEl.dataset.audioPath, todayDate);
                }
            }
        }

        // Reproducir el audio correspondiente
        function playAudio(audioPath, date) {
            const audioElement = document.getElementById('audio-element');
            const audioTitle = document.getElementById('audio-title');
            const audioPathDisplay = document.getElementById('audio-path');
            
            // Actualizar la interfaz
            const liturgicalInfo = getLiturgicalInfo(date);
            const dayName = getDayName(liturgicalInfo.day);
            
            audioTitle.textContent = `Evangelio - ${dayName} ${date.getDate()} de ${getMonthName(date.getMonth())} ${date.getFullYear()}`;
            audioPathDisplay.textContent = `Tiempo: ${timeNames[liturgicalInfo.time]} - Semana ${liturgicalInfo.week}`;
            
            // Establecer la fuente del audio (en un entorno real, aquí iría la URL real)
            audioElement.src = audioPath;
            audioElement.load();
            audioElement.play().catch(e => console.log("Autoplay no permitido:", e));
        }

        function getMonthName(monthIndex) {
            const months = ["Enero", "Febrero", "Marzo", "Abril", "Mayo", "Junio",
                           "Julio", "Agosto", "Septiembre", "Octubre", "Noviembre", "Diciembre"];
            return months[monthIndex];
        }

        // Inicializar el calendario
        let currentDate = new Date();
        let currentYear = currentDate.getFullYear();
        let currentMonth = currentDate.getMonth();

        // Configurar el selector de año
        const yearSelect = document.getElementById('year-select');
        const availableYears = Object.keys(liturgicalData).sort();
        
        availableYears.forEach(year => {
            const option = document.createElement('option');
            option.value = year;
            option.textContent = year;
            yearSelect.appendChild(option);
        });
        
        yearSelect.value = currentYear;
        
        yearSelect.addEventListener('change', function() {
            currentYear = parseInt(this.value);
            generateCalendar(currentYear, currentMonth);
        });

        generateCalendar(currentYear, currentMonth);

        // Manejar botones de navegación
        document.getElementById('prev-month').addEventListener('click', function() {
            currentMonth--;
            if (currentMonth < 0) {
                currentMonth = 11;
                currentYear--;
                yearSelect.value = currentYear;
            }
            generateCalendar(currentYear, currentMonth);
        });

        document.getElementById('next-month').addEventListener('click', function() {
            currentMonth++;
            if (currentMonth > 11) {
                currentMonth = 0;
                currentYear++;
                yearSelect.value = currentYear;
            }
            generateCalendar(currentYear, currentMonth);
        });
    </script>
</body>
</html>
