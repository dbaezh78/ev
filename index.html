<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendario Litúrgico</title>
    <link rel="icon" href="/src/ico.ico" type="image/x-icon">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">

                <h2 style="text-align: center;">Evangelios del Año</h2>

                <div id="audio-player">
            <h3 id="audio-title"></h3>
            <audio style="width: 100%;"  id="audio-element" controls>
                <source id="audio-source" src="" type="audio/mpeg">
                Tu navegador no soporta el elemento de audio.
            </audio>
        </div>

        <h2 id="month-year"></h2>

        <div class="calendar" id="calendar"></div>

<br>
        <div class="calendar-controls">
            <div class="year-selector">
                <label for="year-select">Año:</label>
                <select id="year-select"></select>
            </div>
            <div class="month-selector">
                <label for="month-select">Mes:</label>
                <select id="month-select"></select>
            </div>
            <button id="today-btn">Hoy</button>
            <button id="prev-month">‹</button>
            <button id="next-month">›</button>
        </div>

    </div>

    <script src="liturgical-calendar.js"></script>
</body>
</html>
