<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendario Litúrgico</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f5f5f5;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        .calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .calendar-controls {
            display: flex;
            gap: 10px;
        }
        .calendar {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 10px;
        }
        .day-header {
            font-weight: bold;
            text-align: center;
            padding: 10px;
            background: #4a6fa5;
            color: white;
            border-radius: 4px;
        }
        .day {
            border: 1px solid #ddd;
            padding: 10px;
            min-height: 80px;
            cursor: pointer;
            border-radius: 4px;
        }
        .day:hover {
            background-color: #f0f0f0;
        }
        .today {
            background-color: #e3f2fd;
            border: 2px solid #4a6fa5;
        }
        .empty-day {
            background: #f9f9f9;
            border: none;
        }
        .audio-info {
            font-size: 0.8em;
            margin-top: 5px;
            color: #555;
        }
        #audio-player {
            margin-top: 20px;
            padding: 15px;
            background: #f0f7ff;
            border-radius: 8px;
            display: none;
        }
        #audio-title {
            margin-bottom: 10px;
            color: #333;
        }
        select, button {
            padding: 8px 12px;
            border-radius: 4px;
            border: 1px solid #ddd;
        }
        button {
            background: #4a6fa5;
            color: white;
            border: none;
            cursor: pointer;
        }
        button:hover {
            background: #3a5a8f;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="calendar-header">
            <h2 id="month-year"></h2>
            <div class="calendar-controls">
                <select id="year-select"></select>
                <select id="month-select"></select>
                <button id="today-btn">Hoy</button>
                <button id="prev-month">‹</button>
                <button id="next-month">›</button>
            </div>
        </div>
        
        <div class="calendar" id="calendar"></div>
        
        <div id="audio-player">
            <h3 id="audio-title"></h3>
            <audio id="audio-element" controls style="width: 100%">
                Tu navegador no soporta el elemento de audio.
            </audio>
        </div>
    </div>

    <script src="liturgical-calendar.js"></script>
</body>
</html>
